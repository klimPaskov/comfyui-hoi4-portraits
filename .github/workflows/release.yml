name: Publish release package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release name, for example v2.0.0
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate public workflows
        run: |
          python scripts/build_workflows.py
          git diff --exit-code -- workflows
          python scripts/validate_workflows.py
          python -m unittest discover -s tests -v

      - name: Build model-free package
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: python scripts/release/build_release_artifacts.py --version "$RELEASE_VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          gh release view "$RELEASE_VERSION" >/dev/null 2>&1 || \
            gh release create "$RELEASE_VERSION" --title "HOI4 Portrait Workflows $RELEASE_VERSION" --generate-notes
          gh release upload "$RELEASE_VERSION" dist/* --clobber
