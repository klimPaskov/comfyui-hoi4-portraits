name: Publish release package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release name, for example v1.0.0
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Go for the Windows installer
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Validate public workflows
        run: |
          python scripts/build_workflows.py
          git diff --exit-code -- workflows
          python scripts/validate_workflows.py
          python -m unittest discover -s tests -v

      - name: Build model-free ZIP and Windows installer
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          PACKAGE_VERSION="${RELEASE_TAG#v}"
          python scripts/release/build_release_artifacts.py --version "$PACKAGE_VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          PACKAGE_VERSION="${RELEASE_TAG#v}"
          NOTES_FILE=".github/release-notes/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$RELEASE_TAG" --title "HOI4 Portrait Workflows $PACKAGE_VERSION" --notes-file "$NOTES_FILE"
            fi
          elif [ -f "$NOTES_FILE" ]; then
            gh release create "$RELEASE_TAG" --title "HOI4 Portrait Workflows $PACKAGE_VERSION" --notes-file "$NOTES_FILE" --target "$GITHUB_SHA"
          else
            gh release create "$RELEASE_TAG" --title "HOI4 Portrait Workflows $PACKAGE_VERSION" --generate-notes --target "$GITHUB_SHA"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
