name: Build release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.5"
          cache: false

      - name: Build and verify release packages
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        shell: pwsh
        run: python scripts/release/build_release_artifacts.py --version $env:RELEASE_VERSION

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_VERSION *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_VERSION `
              --title "HOI4 Portrait Workflows $env:RELEASE_VERSION" `
              --notes "ComfyUI workflow package with a portable ZIP, Windows installer, setup guides, and automatic model installation."
          }
          gh release upload $env:RELEASE_VERSION dist/* --clobber
