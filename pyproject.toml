[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-hoi4-portraits"
version = "2.4.8"
description = "Core-node ComfyUI workflows for FLUX.2 Klein 9B HOI4-style portraits"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Klim Paskov" }]
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/klimPaskov/comfyui-hoi4-portraits"
Issues = "https://github.com/klimPaskov/comfyui-hoi4-portraits/issues"
LoRA = "https://huggingface.co/Hoops-McCann/hoi4-portraits-flux2-klein-9b-lora"

[project.optional-dependencies]
dds = ["Pillow>=10"]

[tool.setuptools]
py-modules = []
