[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hoi4-portrait-pipeline"
version = "0.1.0"
description = "Fail-closed ComfyUI orchestration and evidence pipeline for auditable HOI4 portraits."
requires-python = ">=3.10,<3.14"
dependencies = [
  "jsonschema==4.25.1",
  "Pillow==11.3.0",
]

[project.scripts]
hoi4-portrait-preflight = "portrait_pipeline.preflight:main"
hoi4-portrait-build-workflows = "portrait_pipeline.graph_spec.builder:main"
hoi4-portrait-acceptance = "portrait_pipeline.acceptance:main"
hoi4-portrait-mcp = "portrait_pipeline.mcp.adapter:main"
hoi4-portrait-preprocessing-service = "portrait_pipeline.preprocessing_service:main"

[tool.setuptools.packages.find]
where = ["src"]
