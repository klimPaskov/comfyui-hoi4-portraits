[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-hoi4-portraits"
version = "1.0.1"
description = "HOI4 portrait workflows for ComfyUI with the distilled FLUX.2 Klein 9B model"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Klim Paskov" }]
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/klimPaskov/comfyui-hoi4-portraits"
Issues = "https://github.com/klimPaskov/comfyui-hoi4-portraits/issues"
LoRA = "https://huggingface.co/Hoops-McCann/hoi4-portraits-flux2-klein-9b-lora"

[project.optional-dependencies]
dds = ["Pillow>=10.4"]

[tool.setuptools]
py-modules = []
